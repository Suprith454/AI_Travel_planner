<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YatraAI — Your Personal Indian Travel Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:#0A0F2C;color:#FDF6EC;overflow-x:hidden}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0A0F2C}
::-webkit-scrollbar-thumb{background:#F0A500;border-radius:3px}
::selection{background:#F0A500;color:#0A0F2C}
h1,h2,h3,h4,h5,h6{font-family:'Playfair Display',serif}
a{text-decoration:none;color:inherit}
input,select,button,textarea{font-family:'DM Sans',sans-serif;outline:none}

.orbs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.15;animation:orbFloat 20s ease-in-out infinite}
.orb:nth-child(1){width:600px;height:600px;background:#F0A500;top:-10%;left:-5%;animation-delay:0s}
.orb:nth-child(2){width:500px;height:500px;background:#FF6B6B;bottom:-10%;right:-5%;animation-delay:-7s}
.orb:nth-child(3){width:400px;height:400px;background:#F0A500;bottom:30%;right:30%;animation-delay:-14s}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(50px,-80px) scale(1.1)}50%{transform:translate(-30px,50px) scale(0.9)}75%{transform:translate(40px,30px) scale(1.05)}}

.app-wrapper{display:flex;min-height:100vh;position:relative;z-index:1}
.main-content{flex:1;min-width:0;padding-top:72px;transition:margin-right 0.3s ease}
.chat-open .main-content{margin-right:360px}

.navbar{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,15,44,0.85);backdrop-filter:blur(16px) saturate(1.2);border-bottom:1px solid rgba(240,165,0,0.1);padding:0 32px;height:72px;display:flex;align-items:center;justify-content:space-between}
.navbar-logo{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:#F0A500;display:flex;align-items:center;gap:8px}
.navbar-links{display:flex;gap:4px;list-style:none;align-items:center}
.navbar-links a{padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;color:rgba(253,246,236,0.6);transition:all 0.3s ease;position:relative;letter-spacing:0.3px}
.navbar-links a:hover,.navbar-links a.active{color:#FDF6EC;background:rgba(240,165,0,0.08)}
.navbar-links a.active::after{content:'';position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:16px;height:3px;background:#F0A500;border-radius:2px}
.mobile-menu-btn{display:none;background:none;border:none;color:#FDF6EC;font-size:24px;cursor:pointer}

.section{padding:80px 48px;max-width:1100px;margin:0 auto;opacity:0;transform:translateY(30px);transition:opacity 0.7s ease,transform 0.7s ease}
.section.visible{opacity:1;transform:translateY(0)}
.section-header{text-align:center;margin-bottom:48px}
.section-header h2{font-size:36px;font-weight:700;color:#FDF6EC;margin-bottom:8px}
.section-header p{color:rgba(253,246,236,0.5);font-size:16px}
.gold-accent{display:inline-block;width:60px;height:3px;background:#F0A500;border-radius:2px;margin-top:12px}

.glass{background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:16px;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1)}
.glass:hover{border-color:rgba(240,165,0,0.2);transform:translateY(-2px);box-shadow:0 12px 40px rgba(240,165,0,0.06)}

.hero{min-height:calc(100vh - 72px);display:flex;align-items:center;justify-content:center;padding:40px 48px;position:relative;overflow:hidden}
.hero-content{text-align:center;max-width:800px}
.hero h1{font-size:56px;font-weight:800;color:#FDF6EC;margin-bottom:12px;background:linear-gradient(135deg,#FDF6EC 0%,#F0A500 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:18px;color:rgba(253,246,236,0.6);margin-bottom:40px}

.trip-form{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:32px;text-align:left}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1 / -1}
.form-group label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:rgba(253,246,236,0.5)}
.form-group input,.form-group select{padding:12px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.3);color:#FDF6EC;font-size:14px;transition:border-color 0.3s}
.form-group input:focus,.form-group select:focus{border-color:#F0A500}
.form-group select option{background:#0A0F2C;color:#FDF6EC}
.dest-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.dest-chip{padding:6px 14px;border-radius:20px;border:1px solid rgba(240,165,0,0.2);background:transparent;color:rgba(253,246,236,0.7);font-size:12px;cursor:pointer;transition:all 0.3s ease}
.dest-chip:hover,.dest-chip.active{background:rgba(240,165,0,0.15);border-color:#F0A500;color:#F0A500}
.budget-display{font-size:20px;font-weight:700;color:#F0A500}
input[type="range"]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,#F0A500,#FF6B6B);border:none!important;padding:0!important;cursor:pointer}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#F0A500;border:3px solid #0A0F2C;cursor:pointer;box-shadow:0 0 10px rgba(240,165,0,0.3)}
.cta-btn{grid-column:1 / -1;padding:16px 32px;border:none;border-radius:12px;background:linear-gradient(135deg,#F0A500,#e09400);color:#0A0F2C;font-size:16px;font-weight:700;cursor:pointer;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);letter-spacing:0.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.cta-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(240,165,0,0.3)}
.cta-btn:active{transform:scale(0.97)}

.itinerary-grid{display:flex;flex-direction:column;gap:24px}
.day-card{padding:28px;position:relative}
.day-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,0.06)}
.day-badge{display:flex;align-items:center;gap:12px}
.day-number{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#F0A500,#e09400);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#0A0F2C}
.day-date{font-size:13px;color:rgba(253,246,236,0.4)}
.weather-badge{display:flex;align-items:center;gap:6px;font-size:14px;color:#F0A500}
.activities{display:flex;flex-direction:column;gap:16px}
.activity-card{display:flex;align-items:flex-start;gap:16px;background:rgba(255,255,255,0.02);border-radius:12px;padding:16px;border-left:3px solid;transition:all 0.3s ease}
.activity-card:hover{background:rgba(255,255,255,0.04)}
.activity-time{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:#F0A500;min-width:80px;padding-top:2px}
.activity-details{flex:1}
.activity-details h4{font-size:15px;margin-bottom:4px}
.activity-details p{font-size:13px;color:rgba(253,246,236,0.5);line-height:1.5}
.activity-meta{display:flex;gap:12px;margin-top:8px;font-size:12px;color:rgba(253,246,236,0.4)}
.add-activity-btn{margin-top:12px;padding:10px 20px;border:1px dashed rgba(240,165,0,0.3);border-radius:10px;background:transparent;color:#F0A500;font-size:13px;cursor:pointer;transition:all 0.3s;width:100%}
.add-activity-btn:hover{background:rgba(240,165,0,0.06);border-color:#F0A500}

.budget-dashboard{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.budget-card{padding:28px}
.budget-card h3{font-size:18px;margin-bottom:16px}
.budget-chart-container{height:260px}
.budget-metrics{display:flex;gap:16px;flex-wrap:wrap}
.budget-metric{flex:1;min-width:120px;text-align:center;padding:16px;background:rgba(255,255,255,0.02);border-radius:12px}
.budget-metric .value{font-size:22px;font-weight:700;color:#F0A500}
.budget-metric .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:rgba(253,246,236,0.4);margin-top:4px}
.progress-bar{height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;border-radius:4px;transition:width 0.6s ease}
.budget-health{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600}
.expense-table{grid-column:1 / -1}
.expense-table table{width:100%;border-collapse:collapse;font-size:13px}
.expense-table th{text-align:left;padding:12px 8px;border-bottom:1px solid rgba(255,255,255,0.06);font-size:11px;text-transform:uppercase;letter-spacing:1px;color:rgba(253,246,236,0.4)}
.expense-table td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,0.03)}
.expense-table input,.expense-table select{background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:6px 10px;color:#FDF6EC;font-size:13px;width:100%}
.add-row-btn,.export-btn{padding:10px 20px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all 0.3s}
.add-row-btn{background:rgba(240,165,0,0.1);color:#F0A500}
.export-btn{background:linear-gradient(135deg,#F0A500,#e09400);color:#0A0F2C;margin-left:12px}
.add-row-btn:hover{background:rgba(240,165,0,0.2)}
.del-btn{background:none;border:none;color:#FF6B6B;cursor:pointer;font-size:16px}

.hotel-filters{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.hotel-filters button{padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:rgba(253,246,236,0.6);font-size:13px;cursor:pointer;transition:all 0.3s}
.hotel-filters button:hover,.hotel-filters button.active{border-color:#F0A500;color:#F0A500;background:rgba(240,165,0,0.08)}
.hotel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.hotel-card{padding:24px}
.hotel-card .stars{color:#F0A500;font-size:14px;margin-bottom:4px}
.hotel-card h4{font-size:18px;margin-bottom:4px}
.hotel-card .location{font-size:12px;color:rgba(253,246,236,0.4);margin-bottom:12px}
.hotel-amenities{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.amenity-tag{padding:4px 10px;border-radius:6px;background:rgba(255,255,255,0.04);font-size:11px;color:rgba(253,246,236,0.5)}
.hotel-price{font-size:20px;font-weight:700;color:#F0A500}
.hotel-price span{font-size:12px;font-weight:400;color:rgba(253,246,236,0.4)}
.book-btn{margin-top:12px;padding:10px 24px;border:none;border-radius:8px;background:linear-gradient(135deg,#F0A500,#e09400);color:#0A0F2C;font-weight:600;font-size:13px;cursor:pointer;transition:all 0.3s}
.book-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(240,165,0,0.2)}

.flight-filters{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.flight-filters button{padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:rgba(253,246,236,0.6);font-size:13px;cursor:pointer;transition:all 0.3s}
.flight-filters button:hover,.flight-filters button.active{border-color:#F0A500;color:#F0A500;background:rgba(240,165,0,0.08)}
.flight-list{display:flex;flex-direction:column;gap:16px}
.flight-card{display:flex;align-items:center;justify-content:space-between;padding:24px;flex-wrap:wrap;gap:16px}
.flight-airline{display:flex;align-items:center;gap:12px}
.flight-airline h4{font-size:16px}
.flight-airline .code{font-size:11px;color:rgba(253,246,236,0.3)}
.flight-route{display:flex;align-items:center;gap:16px}
.flight-route .time{font-size:20px;font-weight:700}
.flight-route .airport{font-size:11px;color:rgba(253,246,236,0.4);text-align:center}
.flight-route .line{width:60px;height:1px;background:linear-gradient(90deg,#F0A500,transparent);position:relative}
.flight-route .line::after{content:'>';position:absolute;right:0;top:-7px;color:#F0A500;font-size:12px}
.flight-details{text-align:right}
.flight-details .price{font-size:20px;font-weight:700;color:#F0A500}
.flight-details .stops{font-size:11px;color:rgba(253,246,236,0.4)}
.select-flight-btn{padding:10px 24px;border:none;border-radius:8px;background:rgba(240,165,0,0.1);color:#F0A500;font-weight:600;font-size:13px;cursor:pointer;transition:all 0.3s}
.select-flight-btn:hover{background:rgba(240,165,0,0.2)}

.checklist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.checklist-category{padding:20px}
.checklist-category h4{font-size:14px;margin-bottom:12px;color:#F0A500}
.checklist-items{display:flex;flex-direction:column;gap:8px}
.checklist-item{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;transition:all 0.3s}
.checklist-item input[type="checkbox"]{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:4px;border:2px solid rgba(255,255,255,0.15);cursor:pointer;transition:all 0.3s;position:relative;flex-shrink:0}
.checklist-item input[type="checkbox"]:checked{background:#F0A500;border-color:#F0A500}
.checklist-item input[type="checkbox"]:checked::after{content:'✓';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0A0F2C;font-size:12px;font-weight:700}
.checklist-item.checked span{text-decoration:line-through;opacity:0.3}
.checklist-progress{grid-column:1 / -1;text-align:center;margin-bottom:8px}
.checklist-progress p{font-size:14px;color:rgba(253,246,236,0.5);margin-bottom:8px}
.add-custom-item{display:flex;gap:8px;margin-top:12px}
.add-custom-item input{flex:1;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.3);color:#FDF6EC;font-size:13px}
.add-custom-item button{padding:8px 16px;border:none;border-radius:8px;background:rgba(240,165,0,0.1);color:#F0A500;font-weight:600;font-size:13px;cursor:pointer}
.dl-checklist-btn{margin-top:20px;padding:12px 28px;border:none;border-radius:10px;background:linear-gradient(135deg,#F0A500,#e09400);color:#0A0F2C;font-weight:600;font-size:14px;cursor:pointer;transition:all 0.3s}

.tips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.tip-card{padding:24px}
.tip-card h4{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.tip-card p{font-size:13px;color:rgba(253,246,236,0.6);line-height:1.7}
.tip-card .emergency-num{font-size:18px;font-weight:700;color:#FF6B6B}
.dest-badge{display:inline-block;padding:4px 14px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(240,165,0,0.1);color:#F0A500;margin-top:4px}

.chat-panel{position:fixed;top:72px;right:0;width:360px;height:calc(100vh - 72px);background:rgba(10,15,44,0.95);backdrop-filter:blur(16px) saturate(1.2);border-left:1px solid rgba(240,165,0,0.1);display:flex;flex-direction:column;z-index:50;transform:translateX(100%);transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1)}
.chat-panel.open{transform:translateX(0)}
.chat-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.chat-header-left{display:flex;align-items:center;gap:10px}
.chat-header h3{font-size:16px}
.online-dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,0.4)}
.api-key-input{background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:6px 10px;color:#FDF6EC;font-size:11px;width:140px}
.api-key-input::placeholder{color:rgba(253,246,236,0.2)}
.chat-messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.chat-msg{max-width:85%;padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.6;animation:msgIn 0.3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,#F0A500,#e09400);color:#0A0F2C;border-bottom-right-radius:4px}
.chat-msg.bot{align-self:flex-start;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.04);border-bottom-left-radius:4px}
.typing-indicator{display:flex;gap:4px;padding:12px 16px;align-self:flex-start;background:rgba(255,255,255,0.04);border-radius:12px;border-bottom-left-radius:4px}
.typing-indicator span{width:6px;height:6px;border-radius:50%;background:rgba(253,246,236,0.3);animation:typing 1.4s infinite}
.typing-indicator span:nth-child(2){animation-delay:0.2s}
.typing-indicator span:nth-child(3){animation-delay:0.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0);background:rgba(253,246,236,0.3)}30%{transform:translateY(-6px);background:#F0A500}}
.quick-chips{display:flex;gap:6px;padding:8px 20px;overflow-x:auto;flex-shrink:0}
.quick-chip{white-space:nowrap;padding:6px 14px;border-radius:16px;border:1px solid rgba(240,165,0,0.15);background:transparent;color:rgba(253,246,236,0.5);font-size:11px;cursor:pointer;transition:all 0.3s}
.quick-chip:hover{border-color:#F0A500;color:#F0A500;background:rgba(240,165,0,0.06)}
.chat-input-area{display:flex;gap:8px;padding:12px 20px;border-top:1px solid rgba(255,255,255,0.06);flex-shrink:0}
.chat-input-area input{flex:1;padding:12px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.3);color:#FDF6EC;font-size:13px}
.chat-input-area input:focus{border-color:#F0A500}
.chat-input-area button{width:44px;height:44px;border-radius:12px;border:none;background:linear-gradient(135deg,#F0A500,#e09400);color:#0A0F2C;font-size:18px;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center}
.chat-input-area button:hover{transform:scale(1.05)}
.chat-input-area button:disabled{opacity:0.4;cursor:not-allowed}
.chat-toggle-mobile{display:none;position:fixed;bottom:24px;right:24px;z-index:60;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#F0A500,#e09400);border:none;color:#0A0F2C;font-size:24px;cursor:pointer;box-shadow:0 4px 20px rgba(240,165,0,0.3);transition:all 0.3s;align-items:center;justify-content:center}
.chat-toggle-mobile:hover{transform:scale(1.1)}
.map-placeholder{height:200px;border-radius:12px;background:rgba(255,255,255,0.02);margin-top:20px;display:flex;align-items:center;justify-content:center;font-size:14px;color:rgba(253,246,236,0.3);border:1px solid rgba(255,255,255,0.04);overflow:hidden}
.map-placeholder iframe{width:100%;height:100%;border:none}
.not-found{padding:60px 20px;text-align:center;color:rgba(253,246,236,0.5)}
.not-found h3{color:#F0A500;margin-bottom:8px}

@media(max-width:1024px){
  .chat-panel{width:320px}
  .chat-open .main-content{margin-right:320px}
}
@media(max-width:768px){
  .navbar-links{display:none}
  .navbar-links.open{display:flex;flex-direction:column;position:absolute;top:72px;left:0;right:0;background:rgba(10,15,44,0.98);padding:16px;border-bottom:1px solid rgba(240,165,0,0.1)}
  .mobile-menu-btn{display:block}
  .section{padding:48px 20px}
  .hero{padding:24px 20px}
  .hero h1{font-size:32px}
  .trip-form{grid-template-columns:1fr;padding:20px}
  .budget-dashboard{grid-template-columns:1fr}
  .chat-panel{position:fixed;top:auto;bottom:0;left:0;width:100%;height:70vh;transform:translateY(100%);border-left:none;border-top:1px solid rgba(240,165,0,0.1);border-radius:20px 20px 0 0}
  .chat-panel.open{transform:translateY(0)}
  .chat-open .main-content{margin-right:0}
  .chat-toggle-mobile{display:flex}
  .chat-panel.open~.chat-toggle-mobile{display:none}
  .hotel-grid,.checklist-grid,.tips-grid{grid-template-columns:1fr}
  .flight-card{flex-direction:column;align-items:flex-start}
  .flight-route{width:100%;justify-content:center}
}
